name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC only: this repository holds no AWS access keys.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      SAHLYKANTA_DOMAIN: ${{ vars.SAHLYKANTA_DOMAIN }}
      SAHLYKANTA_HOSTED_ZONE_ID: ${{ vars.SAHLYKANTA_HOSTED_ZONE_ID }}
      SAHLYKANTA_BUDGET_EMAIL: ${{ vars.SAHLYKANTA_BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve the account id the stack is deployed into
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Show what will change
        run: npx cdk diff
        working-directory: packages/infra
        continue-on-error: true

      - name: Deploy the stack
        run: npx cdk deploy --require-approval never --outputs-file ../../cdk-outputs.json
        working-directory: packages/infra

      - name: Build the site
        run: npm run build -w @sahlykanta/web

      - name: Read stack outputs
        id: outputs
        run: |
          echo "bucket=$(jq -r '.Sahlykanta.SiteBucketName' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r '.Sahlykanta.DistributionId' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the hashed assets with a long cache
        run: |
          aws s3 sync packages/web/dist "s3://${{ steps.outputs.outputs.bucket }}" \
            --delete \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

      # index.html is the one file that must never be cached, or a deploy
      # leaves browsers pointing at asset names that no longer exist.
      - name: Upload index.html with no cache
        run: |
          aws s3 cp packages/web/dist/index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate the distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/index.html" "/"

      - name: Smoke the deployment
        run: |
          set -euo pipefail
          url="https://${SAHLYKANTA_DOMAIN}/api/today"
          body=$(curl -fsS --retry 5 --retry-delay 5 "$url")
          echo "$body"
          # A deploy that answers with the wrong date is a failed deploy.
          echo "$body" | jq -e '.date | test("^\\d{4}-\\d{2}-\\d{2}$")' > /dev/null
          echo "$body" | jq -e 'has("isGameDay")' > /dev/null
