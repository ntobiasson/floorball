name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC only: this repository holds no AWS access keys.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Whether this repository is configured to deploy at all.
  #
  # A job-level `if` cannot read the `secrets` context — GitHub does not
  # expose it there — so the secret is read into an output here and the
  # deploy job keys off that. Without this, a repository with no AWS
  # credentials fails its deploy on every push instead of skipping it.
  config:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=""
          # The budget lives outside the stack (see scripts/create-budget.sh),
          # so the role is the only thing a deploy needs.
          [ -n "$ROLE" ] || missing="$missing AWS_DEPLOY_ROLE_ARN(secret)"

          missing="${missing# }"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

          if [ -z "$missing" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "This repository is not configured to deploy yet. Missing:"
              echo
              for name in $missing; do echo "- \`$name\`"; done
              echo
              echo "See \`docs/runbook.md\`. The tests above still ran."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # A push to main must not reach production without the suite passing.
  check:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.3
        ports:
          - 8001:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8001
      AWS_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: [config, check]
    # Skips cleanly — grey, not red — until the credentials exist.
    if: needs.config.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Overridable, but the stack has no reason to sit in us-east-1 now that
      # there is no CloudFront certificate to keep there.
      AWS_REGION: ${{ vars.SAHLYKANTA_REGION || 'eu-north-1' }}
      SAHLYKANTA_REGION: ${{ vars.SAHLYKANTA_REGION || 'eu-north-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the account id the stack is deployed into
        run: echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Show what will change
        run: npx cdk diff
        working-directory: packages/infra
        continue-on-error: true

      - name: Deploy the stack
        run: npx cdk deploy --require-approval never --outputs-file ../../cdk-outputs.json
        working-directory: packages/infra

      - name: Build the site
        run: npm run build -w @sahlykanta/web

      - name: Read stack outputs
        id: outputs
        run: |
          echo "bucket=$(jq -r '.Sahlykanta.SiteBucketName' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r '.Sahlykanta.DistributionId' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "site=$(jq -r '.Sahlykanta.SiteDomain' cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      # Three steps in this order on purpose. Pruning before the new
      # index.html is published leaves the live page — which is revalidated on
      # every load, being no-cache — pointing at hashed asset names that have
      # just been deleted.
      - name: Publish the new hashed assets
        run: |
          aws s3 sync packages/web/dist "s3://${{ steps.outputs.outputs.bucket }}" \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

      # index.html is the one file that must never be cached, or a deploy
      # leaves browsers pointing at asset names that no longer exist.
      - name: Publish index.html with no cache
        run: |
          aws s3 cp packages/web/dist/index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Prune assets from older deploys
        run: |
          aws s3 sync packages/web/dist "s3://${{ steps.outputs.outputs.bucket }}" \
            --delete \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate the distribution
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/index.html" "/"

      - name: Smoke the deployment
        env:
          SITE: ${{ steps.outputs.outputs.site }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 5 --retry-delay 5 "https://${SITE}/api/today")
          echo "$body"
          echo "$body" | jq -e 'has("isGameDay")' > /dev/null

          # The spec's named anti-goal is a UTC-based date implementation,
          # which breaks Saturday registrations after 02:00 in summer. Assert
          # the actual Helsinki date, not just that the field looks like one.
          expected=$(TZ=Europe/Helsinki date +%F)
          actual=$(echo "$body" | jq -r .date)
          if [ "$actual" != "$expected" ]; then
            echo "api says $actual, Helsinki says $expected" >&2
            exit 1
          fi

          # An API 404 must stay a JSON 404, not become the SPA shell with a
          # 200 — that is the CloudFront misconfiguration this guards against.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://${SITE}/api/players/does-not-exist")
          if [ "$status" != "404" ]; then
            echo "expected 404 for an unknown player, got $status" >&2
            exit 1
          fi

      - name: Say where it is
        env:
          SITE: ${{ steps.outputs.outputs.site }}
        run: |
          {
            echo "### Deployed"
            echo
            echo "<https://${SITE}>"
            echo
            echo "CloudFront's own address. Bookmark it; there is no custom domain."
          } >> "$GITHUB_STEP_SUMMARY"
