<!doctype html>
<!--
  `lang` is Finnish here and changed at runtime once the app knows which
  language it is speaking. Finnish is the right thing to serve: it is what
  this page is, and a crawler reads this shell rather than anything React
  renders over it.

  The title and the description stay Finnish for the same reason, and the
  title would anyway — "Peleille" is the thing's name, not a word to
  translate. Varying the description per visitor would change nothing for
  the only readers it has.
-->
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7a5f" />
    <meta name="description" content="Peleille — ilmoittautuminen ja peliaktiivisuus" />
    <title>Peleille</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Figtree carries no Cyrillic at all, so Ukrainian would otherwise fall
      back to whatever the system supplies. Manrope is asked for beside it and
      takes over wholesale under html[lang='uk'] — see theme.css. Google splits
      each family by unicode-range, so a Finnish or English visitor never
      downloads the Cyrillic bytes.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=Manrope:wght@400;500;700;800&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230e7a5f'/%3E%3Ccircle cx='8' cy='8' r='4.7' fill='none' stroke='white' stroke-width='1.3'/%3E%3Ccircle cx='8' cy='5.9' r='.82' fill='white'/%3E%3Ccircle cx='5.9' cy='9.15' r='.82' fill='white'/%3E%3Ccircle cx='10.1' cy='9.15' r='.82' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
